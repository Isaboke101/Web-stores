<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Kūgeria Ltd</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#052F5F">
  <link rel="icon" href="images/logo_small.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" href="images/logo_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FAFAFA;--green:#004B23;--navy:#052F5F;--gold:#C5A059;--charcoal:#212121}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--charcoal);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:30px 20px;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 60% 50% at 20% 15%,rgba(5,47,95,.05),transparent),
                 radial-gradient(ellipse 55% 55% at 85% 85%,rgba(0,75,35,.05),transparent);
    }
    .logo{height:44px;width:auto;margin-bottom:36px}
    .code{
      font-family:'Cormorant Garamond',serif;font-size:clamp(90px,22vw,150px);
      font-weight:700;line-height:1;color:var(--navy);position:relative;
    }
    .code em{color:var(--gold);font-style:italic}
    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,5vw,30px);font-weight:700;color:var(--charcoal);margin:14px 0 10px}
    p{font-size:14px;color:#6b7280;line-height:1.7;max-width:380px;margin-bottom:30px}
    .acts{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;
      font-size:13.5px;font-weight:600;text-decoration:none;border:2px solid transparent;
      transition:all .22s ease;
    }
    .btn-gold{background:var(--gold);color:var(--charcoal);border-color:var(--gold)}
    .btn-gold:hover{background:#b8903e;border-color:#b8903e;transform:translateY(-2px);box-shadow:0 8px 22px rgba(197,160,89,.35)}
    .btn-navy{background:transparent;color:var(--navy);border-color:var(--navy)}
    .btn-navy:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
    .foot{position:fixed;bottom:20px;font-size:11px;color:#9ca3af}
  </style>
</head>
<body>
  <img src="images/logo.svg" alt="Kūgeria Ltd" class="logo">
  <div class="code">4<em>0</em>4</div>
  <h1>This page took an attempt too far</h1>
  <p>The page you're looking for doesn't exist or has moved. Even the best attempts sometimes need redirecting — let's get you back on track.</p>
  <div class="acts">
    <a href="/" class="btn btn-gold">← Back to Home</a>
    <a href="schedule.html" class="btn btn-navy">Schedule a Meeting</a>
  </div>
  <div class="foot">© 2026 Kūgeria Ltd · Nairobi, Kenya</div>
</body>
</html>
